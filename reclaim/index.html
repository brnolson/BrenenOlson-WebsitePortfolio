<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reclaim MedSpa &amp; Wellness &middot; Private Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #F5F1EA;
    --paper: #FFFFFF;
    --espresso: #2E2A25;
    --ink: #33302B;
    --muted: #726B60;
    --line: #E3DBCE;
    --sage-deep: #5E6A50;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Mulish', sans-serif;
    background: var(--ivory);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- gate ---- */

  .gate {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 48px 44px;
    max-width: 440px;
    width: 100%;
    text-align: center;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--sage-deep);
    font-weight: 600;
    margin-bottom: 18px;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-size: 30px;
    font-weight: 500;
    line-height: 1.15;
    color: var(--espresso);
  }

  .lede {
    color: var(--muted);
    font-size: 15px;
    margin-top: 14px;
  }

  form { margin-top: 30px; }

  input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    font-family: 'Mulish', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--ivory);
    border: 1px solid var(--line);
    border-radius: 3px;
    outline: none;
    text-align: center;
    letter-spacing: 0.08em;
  }

  input[type="password"]:focus { border-color: var(--sage-deep); }

  button {
    width: 100%;
    margin-top: 14px;
    padding: 14px 30px;
    border: 0;
    border-radius: 3px;
    background: var(--espresso);
    color: #F1ECE3;
    font-family: 'Mulish', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  button:hover { opacity: 0.88; }

  .error {
    margin-top: 14px;
    font-size: 13.5px;
    color: #9A5B4C;
    min-height: 20px;
  }

  .footnote {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--muted);
  }

  /* ---- preview ---- */

  .viewer { display: none; height: 100%; }
  body.unlocked .gate { display: none; }
  body.unlocked .viewer { display: block; }

  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
  <div class="gate">
    <div class="card">
      <div class="eyebrow">Private Preview</div>
      <div class="brand">Reclaim MedSpa &amp; Wellness</div>
      <p class="lede">Your first draft is ready. Enter the password to take a look.</p>
      <form id="gate-form" autocomplete="off">
        <input type="password" id="pw" placeholder="Password" aria-label="Password" autofocus>
        <button type="submit">View Preview</button>
        <div class="error" id="error" role="alert"></div>
      </form>
      <div class="footnote">This draft is private and not indexed by search engines. Built by Brenen Olson.</div>
    </div>
  </div>

  <div class="viewer">
    <iframe id="frame" title="Reclaim MedSpa &amp; Wellness preview" loading="lazy"></iframe>
  </div>

<script>
  var PASSWORD = 'reclaim2026';
  var SITE = 'https://reclaim-website-eight.vercel.app/';
  var KEY = 'reclaim-preview';

  function unlock() {
    document.getElementById('frame').src = SITE;
    document.body.classList.add('unlocked');
  }

  if (sessionStorage.getItem(KEY) === 'ok') unlock();

  document.getElementById('gate-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('pw');
    if (input.value.trim().toLowerCase() === PASSWORD) {
      sessionStorage.setItem(KEY, 'ok');
      unlock();
    } else {
      document.getElementById('error').textContent = 'That password is not quite right. Try again.';
      input.value = '';
      input.focus();
    }
  });
</script>
</body>
</html>
